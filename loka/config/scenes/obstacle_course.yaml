# Four props ahead of the start, framed by the run_loka --record camera.
# Robot starts at (0, 0) facing +x. yaw is radians, CCW from +x.
description: "Box near the path, table to the left, chair and bookshelf ahead-right"
props:
  - {kind: box, x: 1.2, y: -0.4, yaw: 0.0}
  - {kind: table, x: 2.0, y: 1.8, yaw: 0.0}
  - {kind: chair, x: 3.5, y: -0.6, yaw: 1.57}
  - {kind: shelf, x: 4.5, y: 1.0, yaw: 3.14}
