# G1 evaluation suite. CLI flags override these values.
# python -m loka.run_eval --config loka/config/eval_suite.yaml

output_dir: results/g1_eval
seed: 0
num_trials: 5
init_noise: 0.005
log_hz: 100
workers: 1

controller:
  config: loka/config/g1.yaml
  stack: legacy_dcm

orchestrator:
  model: gpt-6-luna
  # fixed_sim keeps the plant running for `seconds` of sim time after a
  # dispatch, then waits for the reply. wall uses arrival time. pause waits
  # immediately (zero sim-time latency). Every model is charged the same 4 s
  # of sim time per call, independent of API and machine speed; wall-clock
  # latency is still recorded per turn and in wall_time_to_goal_s.
  latency:
    mode: fixed_sim
    seconds: 4.0
  request_timeout_s: 120.0

recording:
  enabled: false
  fps: 30
  width: 1280
  height: 720
  camera:
    azimuth: 135
    elevation: -25
    distance: 3.5
  # boundary encodes the last survived probe and the first falling probe.
  # all encodes every probe. render.npz is kept either way.
  stand_push_probes: boundary
  min_push_visible_s: 0.3

# Variants for loka_ablated baselines (see loka/config/eval_ablations.yaml for
# the full ablation and model-ladder suite).
ablation_config: loka/config/loka_ablations.yaml

# A baseline is a name, or {name, type, options}. unitree_rl takes
# options.policy_dir (default models/unitree_rl/g1_29dof_velocity_v0) and
# options.min_speed (default 0.30 m/s). Here it is 0.25 m/s, the slowest
# command the v0 policy walks at reliably on this plant: on the nominal goal
# task it never moves at 0.20, stalls partway at 0.22-0.23 and arrives with a
# spread of a few seconds at 0.24. Its training only rewards stepping above
# 0.1 m/s (feet_gait), so the upstream config gives no tighter bound. The other
# baselines walk at 0.15 m/s, so its time to goal is not directly comparable.
# loka and loka_ablated take options.orchestrator, which overrides the
# orchestrator block above for that baseline (model, provider, latency,
# prompt_style, reply_check, max_tokens, temperature); loka_ablated also takes
# options.variant, a name under variants in the ablation config. Examples:
#   - {name: loka_raw_telemetry, type: loka_ablated, options: {variant: raw_telemetry}}
#   - {name: loka_cost_detector, type: loka_ablated, options: {variant: cost_detector}}
#   - {name: loka_claude, type: loka, options: {orchestrator: {model: claude-sonnet-5-5}}}
#   - {name: loka_gemma3_27b, type: loka, options: {orchestrator: {model: gemma-3-27b-it}}}
# Local models (orchestrator_models.yaml, provider: local) run as PACE GPU jobs.
baselines:
  - low_level
  - loka
  - {name: unitree_rl, type: unitree_rl, options: {min_speed: 0.25}}

tasks:
  - name: stand_push
    type: stand_push
    mass:
      body: left_shoulder_roll_link
      delta_kg: 10.0
    mass_time_s: 2.0
    push_delay_s: 10.0
    observe_s: 10.0
    push:
      direction: [0.0, 1.0]
      duration_s: 0.05
    search:
      lo_n: 0.0
      hi_n: 200.0
      max_hi_n: 2000.0
      resolution_n: 0.2
    metrics: [max_push_force_n]

  - name: goto_goal
    type: goto_goal
    goal:
      xy: [3.0, 0.0]
      speed: 0.15
      radius: 0.2
      hold_s: 0.0
    command_time_s: 0.0
    perturbation_time_s: 5.0
    timeout_s: 60.0
    goal_via: directive
    perturbations:
      - {name: nominal, kind: none}
      - {name: torso_mass, kind: mass, body: torso_link, delta_kg: 10.0}
      - {name: shoulder_mass, kind: mass, body: left_shoulder_roll_link, delta_kg: 7.0}
      - {name: weak_right_knee, kind: actuator_gear, actuator: right_knee, scale: 0.75}
      - {name: low_friction, kind: friction, mu: 0.4}
      - {name: shove, kind: push, force_n: 120.0, direction: [0.0, 1.0], duration_s: 0.05}
    metrics: [num_successes, num_falls, time_to_goal_s, wall_time_to_goal_s, path_efficiency, model_invocations]
