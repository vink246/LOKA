# G1 locomotion controller parameters. Everything here mirrors a field on
# LocomotionConfig / MPCConfig / WBCConfig / GaitConfig in loka/control/, and
# the defaults in those dataclasses are what runs when no config is passed:
#
#     python -m loka.main --config loka/config/g1.yaml
#
# This file is also the surface LOKA mutates at runtime, via
# LocomotionController.update_weights() and set_task_targets().

model_path: models/g1/scene.xml
control_dt: 0.002        # whole-body QP period  -> 500 Hz
mpc_decimation: 10       # MPC every 10 QP ticks ->  50 Hz
ground_height: 0.0       # starting guess; refined from the soles once loaded

# Saturation on the task-space accelerations handed to the QP. The CoM cap sits
# near what the soles can actually deliver; a swing foot is a light limb moving
# through free space, so it gets a much wider budget.
max_linear_acc: 20.0     # m/s^2
max_angular_acc: 40.0    # rad/s^2
max_joint_acc: 200.0     # rad/s^2
max_swing_acc: 120.0     # m/s^2
max_swing_ang_acc: 80.0  # rad/s^2; late-swing sole flatten, not a slap

mpc:
  horizon: 6             # x dt = 0.30 s lookahead
  dt: 0.05
  friction_mu: 0.5
  fz_min: 5.0            # N, per contact point; keeps every contact loaded
  fz_max: 400.0

  # Diagonal state cost on [roll pitch yaw], [x y z], [wx wy wz], [vx vy vz].
  weight_orientation: [500.0, 500.0, 300.0]
  weight_position: [120.0, 120.0, 1000.0]
  weight_angular_velocity: [10.0, 10.0, 10.0]
  weight_linear_velocity: [60.0, 60.0, 60.0]
  # CoP stays in the physical sole (Sleiman). The 12 mm ZMP inset lives in
  # the gait *reference*, so the outer sole remains available for tracking.
  cop_margin: 0.002

wbc:
  friction_mu: 0.5
  fz_min: 1.0
  fz_max: 500.0
  contact_kd: 20.0       # velocity damping on the contact points

  # Task weights. Accelerations are m/s^2 or rad/s^2, forces are N.
  # Keeping the feet planted is a cost rather than a hard constraint, so that a
  # landing heel cannot make the program infeasible mid-tick. The weight is
  # large enough that it behaves like a constraint anyway.
  weight_contact: 2000.0
  weight_base_position: 10.0
  weight_base_orientation: 40.0
  weight_posture_legs: 0.02     # legs are pinned by the contacts; barely weight them
  weight_posture_upper: 5.0
  weight_posture_swing: 5.0     # an airborne leg has nothing else holding it
  weight_force: 5.0e-3
  regularization: 1.0e-6

  # Task-space PD gains generating the desired accelerations.
  # A planted biped can only accelerate its CoM by moving the centre of
  # pressure within the soles, which caps the useful authority near
  # g * 0.085 / 0.70 ~ 1.2 m/s^2. Gains that demand much more than that
  # saturate and overshoot the robot straight out of its support polygon.
  kp_base_position: 50.0
  kd_base_position: 15.0
  kp_base_orientation: 300.0
  kd_base_orientation: 30.0
  kp_posture_legs: 0.0          # damping only; a stiffness here fights crouching
  kd_posture_legs: 2.0
  kp_posture_swing: 200.0       # ... but a swing leg needs a real position task
  kd_posture_swing: 20.0
  # Cartesian swing-foot task: the actuator behind the footstep plan. Stance
  # contact is weighted 2000, so this has to be hundreds or the QP inverts
  # the lift (commanded +z, realised −z) and the foot scrapes at 8 mm.
  # Outranks swing-leg joint posture, which drops to a null-space bias.
  weight_swing_foot: 500.0
  kp_swing_foot: 500.0
  kd_swing_foot: 40.0
  # Late-swing sole orientation (world-flat). Below the Cartesian weight so
  # foothold height still wins if the two disagree.
  weight_swing_orient: 40.0
  kp_swing_orient: 200.0
  kd_swing_orient: 28.0
  kp_posture_upper: 100.0
  kd_posture_upper: 10.0

# High-level gait policy (LLM Task_Targets: gait.*). Geometry stays classical:
# the walk line, footstep plan and DCM reference are computed in gait.py.
# If the LLM only sets gait.speed, period / duty / stance_width follow
# gait_schedule_for_speed (duty ~0.82 at a crawl, ~0.74 at 0.50 m/s so the
# swing still has time to land a longer stride). Pin those knobs to override.
# The 0.65 / 0.70 numbers below are isolation-planner defaults, not the walk.
gait:
  mode: 0                 # 0=stand 1=walk 2=tread 3=limp
  speed: 0.0              # m/s in heading frame
  heading: 0.0            # world-frame travel direction [rad]
  step_period: 0.70       # full two-step cycle; a step is half of this
  duty_factor: 0.65       # isolation default; walk fills ~0.74–0.84 from speed
  step_length_max: 0.30
  swing_height: 0.045
  stance_width: 0.24      # nominal G1 stance measures 0.237
  capture_gain: 0.6       # DCM foothold feedback (1.0 = deadbeat capture point)
  walk_accel: 0.5
  foothold_retarget_s: 0.70  # fraction of swing the foothold may still move
