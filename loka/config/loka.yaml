# LOKA session settings. The plant (MPC, WBC, gait) stays in g1.yaml.
# One control step is runtime.step (control_dt, 0.002 s).

# |bias| is the sum of absolute per-actuator effort deviations [Nm].
# Each value is measured force minus the belief inverse dynamics: actuator
# torque (current) plus contact force (foot sensors) plus a known push,
# minus M(q)q̈ + h(q, q̇) of the belief model at the measured state. The
# floating-base wrench is resolved through the foot contacts. The plant
# inertias are not used. A matched model sits at 0. A +10 kg torso error
# while walking is about 20 Nm, so the thresholds sit just above the noise floor.
# A step is out of bounds when |bias|, the motor deficit, or stance slip
# is above its threshold.
# consecutive_steps is how many steps in a row must be out of bounds before
# a failure episode opens. The live count resets on the first in-bounds step
# and when the robot switches between standing and walking.
# clear_below_s is how long |bias| must stay at or below the mode threshold
# before that failure episode closes. A shorter dip does not close it.
# stand_window_steps is the standing average (walking uses two step periods).
# Neither average is published, and neither can open a fault, until that
# window is full. A single startup sample is not a residual.
# stand_on_fault: true commands gait.mode=stand when a walking fault
# opens and the LLM is on. --no-llm never stands for a fault.
# false leaves the robot walking through the fault.
# The same streak also opens on motor deficit or stance slip.
# motor_threshold_nm is |commanded torque - applied torque|. Healthy is 0.
# A standing knee at 75% gear is about 4 Nm.
# slip_threshold_mps is planted-sole tangential speed. A healthy walk
# stays under 0.11 m/s; ice does not.
effort_bias:
  consecutive_steps: 250
  stand_threshold_nm: 5.0
  walk_threshold_nm: 5.0
  motor_threshold_nm: 0.75
  slip_threshold_mps: 0.15
  stand_window_steps: 100
  clear_below_s: 0.5
  stand_on_fault: true

# cooldown_s starts when an orchestrator edit is applied. No LLM call
# (effort episode, listener, heartbeat, or operator) is sent during it.
# max_turns is how many orchestrator turns one failure episode may use
# before the bias is back in bounds. The next episode starts a new count.
# max_memory is how many completed turns of one conversation stay visible.
# It must be <= max_turns. The next turn after that many, and every turn
# after it, omits earlier messages and attempted fixes. The model reasons
# from the live telemetry, tunables, and model belief. Applied controller
# targets and model mutations stay. A new failure episode starts a new count.
# Equal to max_turns keeps every turn of a failure episode; the operator
# session still forgets after this many of its own turns.
session:
  cooldown_s: 2.0
  heartbeat_s: 15.0
  telemetry_window_s: 2.0
  max_turns: 6
  max_memory: 3

# Egocentric head camera (run_loka --vision). Every orchestrator user turn
# carries one width x height RGB PNG from ego_cam on the G1 head, rendered at
# the instant of dispatch. fovy_deg is the vertical field of view (square
# pixels, so a square image has the same horizontal FOV). pitch_down_deg tilts
# the optical axis below the head's forward axis. detail is the OpenAI image
# detail level. save_frames writes each sent frame to logs/loka/frames/.
# stream_hz caps the live window opened by run_loka --ego-view (frames are
# dropped, never queued, when rendering falls behind).
vision:
  enabled: false
  width: 512
  height: 512
  fovy_deg: 70.0
  pitch_down_deg: 30.0
  detail: high
  save_frames: true
  stream_hz: 15.0

# run_loka --record: a fixed overview camera at +x/-y, looking along +y
# (azimuth 90) and down elevation_deg, so the side-top view covers roughly
# x in [-1, 6] and y in [-2, 8]; the start sits near the left edge. The mp4
# is rendered after the run from the sampled state, in a separate offscreen
# process.
recording:
  directory: recordings
  pos: [2.5, -4.5, 3.0]
  azimuth_deg: 90.0
  elevation_deg: -35.0
  fovy_deg: 45.0
  fps: 30.0
  width: 1920
  height: 1080

# Prop pool for run_loka (models/props/, from HumanoidBench). slots is how many
# of each kind can be placed at once; they are parked off-scene until spawned
# with --props or the spawn command. Kinds in static have no free joint and
# do not move when pushed. run_loka --no-props builds the plain scene.
props:
  slots: {chair: 3, table: 2, box: 4, cube: 4, shelf: 1}
  static: [shelf]

# NaVILA navigation VLA (run_loka --navila). Weights load only from a local
# directory; never pass a Hub id here. On PACE:
#   python scripts/fetch_navila_checkpoint.py --out ~/scratch/models/navila-llama3-8b-8f
# Hub id for that script only: a8cheng/navila-llama3-8b-8f (~16 GB on disk).
# Camera defaults approximate NaVILA's R2R training views (wider FOV, flatter).
navila:
  model_path: ""
  device: cuda:0
  num_frames: 8
  max_new_tokens: 32
  forward_speed: 0.25
  turn_tolerance_deg: 5.0
  goal_tolerance: 0.12
  timeout_factor: 3.0
  max_actions: 40
  unparseable_fallback: stop
  min_free_gb: 20.0
  save_frames: true
  camera:
    width: 512
    height: 512
    fovy_deg: 90.0
    pitch_down_deg: 10.0
    detail: high
    save_frames: true
