name: loka
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
      # Core sim / control (mujoco_mpc is installed separately from source)
      - mujoco==3.2.3
      - numpy>=1.24
      # LOKA orchestrator
      - openai>=1.40
      - python-dotenv>=1.0
      - pyyaml>=6.0
      # Needed to build/install google-deepmind/mujoco_mpc Python bindings
      - grpcio>=1.60
      - grpcio-tools>=1.60
      - protobuf>=4.25
      - matplotlib>=3.8
      - mediapy>=1.2
      # Domain-randomized PPO baseline (native MuJoCo Gymnasium env)
      - gymnasium>=0.29.1
      - stable-baselines3>=2.3.0
      # CPU wheel is enough for this 6-DoF MLP; CUDA torch also works.
      - torch
